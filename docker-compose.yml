services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: carolleonidas
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    build: .
    restart: unless-stopped
    environment:
      DATABASE_URL: postgresql://postgres:postgres@postgres:5432/carolleonidas
      JWT_SECRET: ${JWT_SECRET:-change-me-in-production}
      ADMIN_SEED_EMAIL: ${ADMIN_SEED_EMAIL:-carol.leonidas@gmail.com}
      ADMIN_SEED_PASSWORD: ${ADMIN_SEED_PASSWORD:-Admin@CL2026}
      PORT: 3001
    depends_on:
      postgres:
        condition: service_healthy

  frontend:
    build: ../carolleonidas
    restart: unless-stopped
    ports:
      - "8080:8080"
    depends_on:
      - backend

volumes:
  postgres_data:
